name: Daily briefing

on:
  schedule:
    - cron: "30 5 * * *" # every day 05:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: write out/*.md, upload it as an artifact, publish nothing"
        type: boolean
        default: true
      strict_sources:
        description: "Fail if KEV or NVD coverage is incomplete"
        type: boolean
        default: false

permissions:
  contents: write # commit data/

concurrency:
  group: blog-data
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      BLOG_URL: ${{ vars.BLOG_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Cache source responses, prose, and briefing history
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache
          key: daily-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: daily-cache-
      - name: Build and publish the daily briefing
        env:
          DISCOURSE_URL: ${{ secrets.DISCOURSE_URL }}
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
          DISCOURSE_API_USERNAME: ${{ secrets.DISCOURSE_API_USERNAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS }}
          CF_AI_MODEL_FAST: ${{ vars.CF_AI_MODEL_FAST }}
          CF_AI_MODEL_CHEAP: ${{ vars.CF_AI_MODEL_CHEAP }}
          CF_AI_NEURON_BUDGET: ${{ vars.DAILY_CF_AI_NEURON_BUDGET || '2000' }}
          BLOG_DRAFTS_CATEGORY_ID: ${{ vars.BLOG_DRAFTS_CATEGORY_ID }}
          BLOG_LIVE_CATEGORY_ID: ${{ vars.BLOG_LIVE_CATEGORY_ID }}
          STRICT_SOURCES: ${{ inputs.strict_sources || 'false' }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          OTX_KEY: ${{ secrets.OTX_KEY }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$STRICT_SOURCES" = "true" ]; then args+=(--strict-sources); fi
          python -m hhf.daily "${args[@]}"
      - name: Upload dry-run output
        if: ${{ always() && env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-briefing-out
          path: out/
          if-no-files-found: warn
      - name: Commit data
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no data change"; exit 0; fi
          git commit -m "chore: record daily briefing [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 3))
          done
          exit 1
