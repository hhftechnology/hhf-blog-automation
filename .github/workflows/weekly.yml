name: Weekly advisory

on:
  schedule:
    - cron: "30 14 * * 3" # Wednesdays 14:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: write out/*.md, upload it as an artifact, publish nothing"
        type: boolean
        default: true
      since:
        description: "Window start (YYYY-MM-DD). Empty = the 7 days ending today (today minus 6)"
        type: string
        default: ""
      until:
        description: "Window end (YYYY-MM-DD). Empty = today UTC"
        type: string
        default: ""

permissions:
  contents: write # commit state/posted.json

concurrency:
  group: blog-data
  cancel-in-progress: false

jobs:
  advisory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      SINCE: ${{ inputs.since }}
      UNTIL: ${{ inputs.until }}
      WEEKLY_CATEGORY_ID: ${{ vars.WEEKLY_CATEGORY_ID || '86' }}
      BLOG_URL: ${{ vars.BLOG_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Cache source responses
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache
          key: weekly-cache-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: weekly-cache-v2-
      - name: Build and check the weekly advisory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          until="${UNTIL:-$(date -u +%F)}"
          args=(--dry-run --until "$until")
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ "$DRY_RUN" != "true" ]; then args+=(--save-publication-state); fi
          python -m hhf.weekly "${args[@]}"
          echo "WEEKLY_UNTIL=$until" >> "$GITHUB_ENV"
      - name: Publish the checked advisory and verify it live
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          DISCOURSE_URL: ${{ secrets.DISCOURSE_URL }}
          DISCOURSE_API_KEY: ${{ secrets.DISCOURSE_API_KEY }}
          DISCOURSE_API_USERNAME: ${{ secrets.DISCOURSE_API_USERNAME }}
        run: |
          if [ ! -f "out/weekly_advisory-${WEEKLY_UNTIL}.json" ]; then exit 0; fi
          args=(--publish-artifact --until "$WEEKLY_UNTIL")
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          python -m hhf.weekly "${args[@]}"
      - name: Upload dry-run output
        if: ${{ always() && env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-advisory-out
          path: out/
          if-no-files-found: warn
      - name: Commit posted ids
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -m "chore: record posted advisories [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 3))
          done
          exit 1
